<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

    .wrap { max-width: 520px; }
    .brand {
      letter-spacing: 8px;

    }
    h1 {

      letter-spacing: 10px;
      margin: 0 0 14px;
      line-height: 1;
    }
    .sub {
      font-family: system-ui, -apple-system, sans-serif;

      letter-spacing: 2px;

      color: rgba(245, 240, 232, 0.55);
      font-size: 14px;
      margin: 0 0 36px;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      border: 1px solid #c9a84c;
      color: #c9a84c;
      text-decoration: none;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 2px;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }
    .btn:hover,
    .btn:focus-visible {
      background: #c9a84c;
      color: #0a0a0a;
      outline: none;
    }
    .btn.secondary {
      border-color: rgba(245, 240, 232, 0.25);
      color: rgba(245, 240, 232, 0.8);
    }
    .btn.secondary:hover,
