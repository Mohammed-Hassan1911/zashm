<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <title>ZASHM — Luxury Fashion</title>
  <meta name="description" content="ZASHM — luxury fashion crafted with elegance and precision. Shop premium clothing with delivery across Egypt."/>
  <meta name="robots" content="index, follow"/>
  <link rel="canonical" href="https://za-shm.vercel.app/"/>

  <!-- Open Graph -->
  <meta property="og:type" content="website"/>
  <meta property="og:site_name" content="ZASHM"/>
  <meta property="og:title" content="ZASHM — Luxury Fashion"/>
  <meta property="og:description" content="ZASHM — luxury fashion crafted with elegance and precision. Shop premium clothing with delivery across Egypt."/>
  <meta property="og:url" content="https://za-shm.vercel.app/"/>
  <meta property="og:image" content="https://za-shm.vercel.app/og-image.jpg"/>
  <meta property="og:image:width" content="1200"/>
  <meta property="og:image:height" content="630"/>
  <meta property="og:image:alt" content="ZASHM — Luxury Fashion"/>

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="ZASHM — Luxury Fashion"/>
  <meta name="twitter:description" content="ZASHM — luxury fashion crafted with elegance and precision. Shop premium clothing with delivery across Egypt."/>
  <meta name="twitter:image" content="https://za-shm.vercel.app/og-image.jpg"/>
  <meta name="twitter:image:alt" content="ZASHM — Luxury Fashion"/>

  <!-- Favicon (inline SVG, no binary asset required) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a0a0a'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='40' font-weight='600' fill='%23c9a84c' text-anchor='middle'%3EZ%3C/text%3E%3C/svg%3E"/>

  <!-- Brand faces are self-hosted (see the @font-face block in src/index.css).
       The wordmark is the largest contentful paint, so its roman latin face is
       fetched at parse time and is already decoded when React paints the hero.
       The italic and Montserrat files are discovered from the stylesheet, in
       parallel with the JS, instead of after a third-party stylesheet lands. -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/cormorant-garamond-latin-var.woff2" crossorigin/>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/index.js"></script>
