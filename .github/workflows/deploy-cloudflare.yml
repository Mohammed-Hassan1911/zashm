name: Deploy Cloudflare Worker

on:
  push:
    branches: [main, cloudflare-migration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      ZSHM_REQUIRE_SQL_TESTS: '1'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Expose PostgreSQL tools
        run: |
          PG_BIN="$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1)"
          echo "PostgreSQL bin: ${PG_BIN}"
          echo "${PG_BIN}" >> "$GITHUB_PATH"

      - run: npm ci

      - name: Test before deploy
        run: npm test

      - name: Build production assets
        env:
          ZASHM_BUILD_DIR: build-production
          VITE_SUPABASE_URL: https://ptegprcbtfylqhbnbkih.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          PUBLIC_BASE_URL: https://zashm.za-shm.workers.dev
          ALLOWED_ORIGINS: https://zashm.za-shm.workers.dev
          SITEMAP_ALLOWED_ORIGINS: https://zashm.za-shm.workers.dev
          ZASHM_STOREFRONT_NOINDEX: '1'
        run: npm run build

      - name: Guard bundle
        run: |
          if grep -R -l -E 'SERVICE_ROLE|SESSION_SECRET|TELEGRAM_BOT_TOKEN|UPSTASH_REDIS_REST_TOKEN|production-prep.invalid|PREP_ANON_KEY_NOT_A_REAL_CREDENTIAL' build-production; then
            echo "Forbidden value found in build-production" >&2
            exit 1
          fi
          grep -q '<meta name="robots" content="noindex, nofollow, noarchive"' build-production/index.html
          grep -q '<meta name="robots" content="noindex, nofollow, noarchive"' build-production/shop/index.html

      - name: Deploy to Cloudflare
        run: |
          npx --yes wrangler@4.168.0 deploy \
            --config wrangler.production.toml \
            --tag "gh-${GITHUB_SHA::7}" \
            --message "Auto-deploy ${GITHUB_SHA} from ${GITHUB_REF_NAME}"
