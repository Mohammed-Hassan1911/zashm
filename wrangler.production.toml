# ZASHM PRODUCTION — TEMPORARY workers.dev LAUNCH CONFIGURATION.
#
# Owner-approved launch stage: the public endpoint is the default Cloudflare
# workers.dev hostname only. There is deliberately no route/routes/pattern,
# no zone binding and no custom domain. A paid domain and DNS cutover remain
# separate, unapproved stages.
#
# Server-only credentials are Worker secrets (never committed here). The Worker
# still refuses every request until its Production bindings are complete.

name = "zashm"
main = "worker.mjs"
compatibility_date = "2026-11-24"
workers_dev = true
# Avoid additional hashed public endpoints: only the canonical workers.dev
# hostname above should be reachable. This is not a Route, Zone or Custom Domain.
preview_urls = false

# Non-secret bindings. The temporary workers.dev opt-in and canonical origin are
# validated by the fail-closed guard; the storefront noindex flag keeps every
# visitor-accessible page out of search indices until the real domain is bought.
[vars]
ZASHM_ENVIRONMENT = "production"
PUBLIC_BASE_URL = "https://zashm.za-shm.workers.dev"
ALLOWED_ORIGINS = "https://zashm.za-shm.workers.dev"
SITEMAP_ALLOWED_ORIGINS = "https://zashm.za-shm.workers.dev"
ZASHM_TEMP_WORKERS_DEV = "1"
ZASHM_STOREFRONT_NOINDEX = "1"

[assets]
directory = "./build-production"
binding = "ASSETS"
html_handling = "none"
# Unknown routes stay real 404s (served from build-production/404.html).
not_found_handling = "404-page"
# Keep every security control on dynamic/API/canonical/404 paths while immutable
# static files are served directly by Cloudflare Assets. Negative patterns have
# precedence over the catch-all, exactly as in the Staging config.
run_worker_first = [
  "/*",
  "!/assets/*",
  "!/fonts/*",
  "!/media/*",
  "!/*.css",
  "!/*.woff",
  "!/*.woff2",
  "!/*.ttf",
  "!/*.otf",
  "!/*.webp",
  "!/*.avif",
  "!/*.jpg",
  "!/*.jpeg",
  "!/*.png",
  "!/*.svg",
  "!/*.gif",
  "!/*.ico",
  "!/*.json",
  "!/*.txt",
  "!/*.map",
  "!/_headers",
  "!/_redirects",
]
