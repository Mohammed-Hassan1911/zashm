name = "zashm"
main = "worker.mjs"
compatibility_date = "2026-11-24"
workers_dev = true

# Node built-ins (Buffer, crypto, stream-shaped req shim) are used by api/_lib.js.
# Dates >= 2026-08-04 enable nodejs_compat + nodejs_compat_v2 by default.
# Dates >= 2025-04-01 also populate process.env from Worker vars/secrets.

[assets]
directory = "./build"
binding = "ASSETS"
html_handling = "none"
# Unknown routes stay real 404s (served from build/404.html).
not_found_handling = "404-page"
# Selective Worker-first routing: dynamic/API/canonical/404 paths must reach
# the Worker, while immutable static assets are served directly by Cloudflare
# Assets (their headers/CSP come from public/_headers, unchanged). This keeps
# every security control and only removes needless Worker invocations.
#
# Negative patterns have precedence over positive ones, so `/*` keeps the
# Worker in front of all non-asset routes (including private SPA routes and
# unknown routes that must stay real 404s).
run_worker_first = [
  "/*",
  "!/assets/*",
  "!/fonts/*",
  "!/media/*",
  "!/*.css",
  "!/*.woff",
  "!/*.woff2",
  "!/*.ttf",
  "!/*.otf",
  "!/*.webp",
  "!/*.avif",
  "!/*.jpg",
  "!/*.jpeg",
  "!/*.png",
  "!/*.svg",
  "!/*.gif",
  "!/*.ico",
  "!/*.json",
  "!/*.txt",
  "!/*.map",
  "!/_headers",
  "!/_redirects",
]
